name: CI

on:
  pull_request:
  push:
    branches: [main, "arena/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > noditos-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: noditos-sbom-${{ github.sha }}
          path: noditos-sbom.cdx.json

name: build-exe

# Compila Noditos.exe en un runner Windows real de GitHub.
# Reemplaza a build-exe.bat: ya no hace falta compilar nada en la PC del
# usuario. Se dispara a mano (workflow_dispatch) y, si sale bien, deja el
# ejecutable verificado en release/Noditos.exe de la rama.

on:
  workflow_dispatch:
    inputs:
      commit_back:
        description: "Commitear release/Noditos.exe en la rama"
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths-ignore:
      - "README**"
      - "**.md"

permissions:
  contents: write

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Instalar dependencias
        run: |
          npm ci --no-audit --no-fund
          # Salvaguarda por si npm bloquea el postinstall de esbuild
          npm rebuild esbuild

      - name: Typecheck y tests
        run: |
          npx tsc --noEmit
          npx vitest run

      - name: Compilar la web (dist/)
        run: npx vite build

      - name: Empaquetar Noditos.exe (pkg)
        run: >
          node node_modules/@yao-pkg/pkg/lib-es5/bin.js server.cjs
          --targets node22.23.2-win-x64
          --config pkg.json
          --output release/Noditos.exe

      - name: Verificar el ejecutable
        shell: pwsh
        run: |
          $exe = "release/Noditos.exe"
          if (!(Test-Path $exe)) { throw "No existe $exe" }

          # Cabecera MZ (binario Windows)
          $fs = [System.IO.File]::OpenRead($exe)
          $b1 = $fs.ReadByte(); $b2 = $fs.ReadByte(); $fs.Close()
          if ($b1 -ne 0x4D -or $b2 -ne 0x5A) { throw "No es un binario Windows (falta cabecera MZ)" }

          # Tamaño: una base sin dist/ pesa ~57 MB; menos de 20 MB = dist no incrustada
          $size = (Get-Item $exe).Length
          Write-Host "Tamano: $size bytes"
          if ($size -lt 20MB) { throw "Demasiado pequeno ($size): dist/ probablemente no se incrusto" }

          # Contenido incrustado:
          # 1) el placeholder del token del boton "Detener", y
          # 2) los nombres de assets CON HASH de este dist/ recien compilado.
          #    Si el exe tuviera un dist viejo, los hashes no coincidirian.
          $ascii = [System.IO.File]::ReadAllText($exe, [System.Text.Encoding]::Latin1)
          if (-not $ascii.Contains("__NODITOS_STOP_TOKEN__")) { throw "El exe no contiene el token del boton Detener" }
          Write-Host "OK: contiene el token del boton Detener"

          $html = Get-Content dist/index.html -Raw
          $assets = [regex]::Matches($html, 'assets/[A-Za-z0-9._-]+') | ForEach-Object { $_.Value } | Sort-Object -Unique
          if (!$assets) { throw "No se encontraron assets en dist/index.html" }
          foreach ($asset in $assets) {
            if (-not $ascii.Contains($asset)) { throw "El exe no contiene '$asset' (dist desactualizado o no incrustado)" }
            Write-Host "OK: contiene $asset"
          }

          Write-Host "SHA256: $((Get-FileHash $exe -Algorithm SHA256).Hash)"

      - name: Prueba de humo en Windows (arrancar el exe y consultar el servidor)
        shell: pwsh
        run: |
          $exeDir = "$PWD\release"
          Start-Process -FilePath "$exeDir\Noditos.exe" -WorkingDirectory $exeDir -WindowStyle Hidden

          # El exe se relanza en segundo plano; esperar a que el servidor responda
          $ok = $false
          foreach ($i in 1..15) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:4173/__noditos/ping" -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) {
            Get-Process Noditos -ErrorAction SilentlyContinue | Stop-Process -Force
            if (Test-Path "$exeDir\Noditos-servidor.log") { Get-Content "$exeDir\Noditos-servidor.log" }
            throw "El servidor no respondio en http://127.0.0.1:4173"
          }

          $html = (Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:4173/" -TimeoutSec 5).Content
          if ($html -notmatch "assets/index") { throw "index.html no sirve los assets" }
          Write-Host "OK: Noditos.exe levanto el servidor y sirve la app en http://127.0.0.1:4173"

          Get-Process Noditos -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Subir Noditos.exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Noditos-exe
          path: release/Noditos.exe
          if-no-files-found: error

      - name: Commitear release/Noditos.exe en la rama
        if: ${{ inputs.commit_back }}
        shell: bash
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add release/Noditos.exe
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "build: regenerar release/Noditos.exe (run ${{ github.run_number }})"
            git push
          fi
